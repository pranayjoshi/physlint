name: Bug report
description: Report incorrect behavior, a crash, or an unclear operational failure.
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: Physlint version
      description: Output from `physlint --version`.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The sanitized command that failed.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the exit code and sanitized error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Prefer a public revision-pinned source or a small generated fixture.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private paths, images, and sensitive sample values.
          required: true
