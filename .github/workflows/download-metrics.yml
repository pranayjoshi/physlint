name: Update download metrics

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh PyPI monthly download snapshot
        run: python .github/scripts/update_download_metrics.py docs/metrics/downloads.json
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- docs/metrics/downloads.json; then
            echo "Download snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/downloads.json
          git commit -m "Update PyPI download metrics"
          git push
