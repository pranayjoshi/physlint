[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "physlint"
version = "0.1.0a0"
description = "Local-first integrity validation for physical-AI datasets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Physlint contributors" }]
dependencies = [
  "numpy>=1.26,<2.5",
  "pyarrow>=16",
  "pydantic>=2.8",
  "PyYAML>=6",
  "rich>=13",
  "typer>=0.12",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.9"]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
  "types-PyYAML>=6",
]

[project.scripts]
physlint = "physlint.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/physlint"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["physlint"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "physlint.cli"
disallow_untyped_decorators = false
